name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, dev, staging ]
  push:
    branches: [ main, dev, staging ]

env:
  REGISTRY: ghcr.io
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Running Unit & Integration tests stage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: './StocksAppSolution/StocksAppSolution.sln'

      - name: Restore dependencies
        run: dotnet restore ./StocksAppSolution/StocksAppSolution.sln

      - name: Build solution
        run: dotnet build ./StocksAppSolution/StocksAppSolution.sln --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test ./StocksAppSolution/StocksAppSolution.sln --no-build --configuration Release --verbosity normal

  build-and-deploy:
    name: Build and deploy stage
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        run: echo "REPO_OWNER=${REPO_OWNER,,}" >> $GITHUB_ENV

      - name: Compute Target Namespace
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          
          if [ "$BRANCH_NAME" = "main" ]; then
            TARGET_NS="production"
            APP_ENV="Production"
          elif [ "$BRANCH_NAME" = "staging" ]; then
            TARGET_NS="staging"
            APP_ENV="Staging"
          else
            TARGET_NS="development"
            APP_ENV="Development"
          fi

          echo "DEPLOY_NAMESPACE=${TARGET_NS}" >> $GITHUB_ENV
          echo "APP_ENV=${APP_ENV}" >> $GITHUB_ENV
          echo "Target namespace set to: ${TARGET_NS}"

      - name: Build and Push WebAPI
        uses: docker/build-push-action@v5
        with:
          context: ./StocksAppSolution
          file: ./StocksAppSolution/StocksApp.WebApi/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/stocksapp.webapi:${{ github.sha }}

      - name: Build and Push OrdersWorker
        uses: docker/build-push-action@v5
        with:
          context: ./StocksAppSolution
          file: ./StocksAppSolution/StocksApp.OrdersWorker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/stocksapp.ordersworker:${{ github.sha }}
      
      - name: Build and Push React frontend
        uses: docker/build-push-action@v5
        with:
          context: ./StocksAppSolution/StocksApp.Frontend
          file: ./StocksAppSolution/StocksApp.Frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/stocksapp.frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Substitute and Apply Manifests via Kustomize
        env:
          IMAGE_TAG: ${{ github.sha }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          WEBAPI_FINNHUB_API_KEY: ${{ secrets.WEBAPI_FINNHUB_API_KEY }}
          WORKER_FINNHUB_API_KEY: ${{ secrets.WORKER_FINNHUB_API_KEY }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          VARS='$DEPLOY_NAMESPACE:$REPO_OWNER:$IMAGE_TAG:$APP_ENV:$JWT_KEY:$WEBAPI_FINNHUB_API_KEY:$WORKER_FINNHUB_API_KEY:$DB_USER:$DB_PASSWORD:$DB_NAME:$RABBITMQ_USER:$RABBITMQ_PASSWORD'

          # Kustomize builds the resources in exact order, envsubst replaces variables, kubectl applies
          kubectl kustomize k8s/ | envsubst "$VARS" | kubectl apply -f -