name: Build and Push Docker Services

on:
  pull_request:
    branches:
      - main
      - dev
      - staging
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' 

      - name: Restore dependencies
        run: dotnet restore ./StocksAppSolution/StocksAppSolution.sln

      - name: Build solution
        run: dotnet build ./StocksAppSolution/StocksAppSolution.sln --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test ./StocksAppSolution/StocksAppSolution.sln --no-build --configuration Release --verbosity normal

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: stocksapp.webapi
            context: ./StocksAppSolution
            dockerfile: ./StocksAppSolution/StocksApp.WebApi/Dockerfile
          - name: stocksapp.ordersworker
            context: ./StocksAppSolution
            dockerfile: ./StocksAppSolution/StocksApp.OrdersWorker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
     
      - name: Lowercase Repository Owner
        run: |
          echo "REPO_OWNER=${OWNER,,}" >> "${GITHUB_ENV}"
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Log in to GHCR
      # Only log in if we are actually pushing (avoids unnecessary auth on PRs)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/${{ matrix.name }}:latest
            ghcr.io/${{ env.REPO_OWNER }}/${{ matrix.name }}:${{ github.sha }}