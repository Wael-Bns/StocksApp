name: Build and Push Docker Services

on:
  push:
    branches:
      - main
      - dev
      - staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: stocksapp.webapi
            context: ./StocksAppSolution
            dockerfile: ./StocksAppSolution/StocksApp.WebApi/Dockerfile
          - name: stocksapp.ordersworker
            context: ./StocksAppSolution
            dockerfile: ./StocksAppSolution/StocksApp.OrderWorker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}