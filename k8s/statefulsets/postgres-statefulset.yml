apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ${DEPLOY_NAMESPACE}
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "${DB_USER}"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              value: "${DB_PASSWORD}"
            - name: POSTGRES_DB
              value: "${DB_NAME}"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        # DigitalOcean/Cloud storage class (leave commented out for default local/minikube storage)
        # storageClassName: do-block-storage
        resources:
          requests:
            storage: 10Gi