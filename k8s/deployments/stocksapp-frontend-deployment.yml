apiVersion: apps/v1
kind: Deployment
metadata:
  name: stocksapp-frontend
  namespace: ${DEPLOY_NAMESPACE}
  labels:
    app: stocksapp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stocksapp-frontend
  template:
    metadata:
      labels:
        app: stocksapp-frontend
    spec:
      containers:
      - name: stocksapp-frontend
        image: ghcr.io/${REPO_OWNER}/stocksapp.frontend:${IMAGE_TAG}
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"