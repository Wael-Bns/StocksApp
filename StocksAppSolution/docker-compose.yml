services:
  stocksapp.webapi:
    image: stocksappwebapi:dev
    build:
      context: .
      dockerfile: StocksApp.WebApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-container;Port=5432;Username=postgres;Password=password;Database=stocksappdb
      - RabbitMQ__HostName=rabbitmq-container
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=admin
      - Observability__ServiceName=StocksApp.WebApi
      - Observability__OtlpEndpoint=http://alloy:4317
    ports:
      - "8088:8080"
      - "8089:8081"
    depends_on:
      - rabbitmq-container
    networks:
      - stocksapp-network
  
  ordersworker:
    image: ordersworker:dev
    build:
      context: .
      dockerfile: StocksApp.OrdersWorker/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-container;Port=5432;Username=postgres;Password=password;Database=stocksappdb
      - RabbitMQ__HostName=rabbitmq-container
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=admin
      - Observability__ServiceName=StocksApp.OrdersWorker
      - Observability__OtlpEndpoint=http://alloy:4317
    depends_on:
      - rabbitmq-container
    networks:
      - stocksapp-network

  postgres-container:
    image: postgres:15.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stocksappdb
    ports:
      - "5434:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - stocksapp-network

  rabbitmq-container:
    image: rabbitmq:3.11-management
    ports:
      - "5672:5672"   
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - stocksapp-network

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - stocksapp-network
  
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    networks:
      - stocksapp-network
  
  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    networks:
      - stocksapp-network

  alloy:
    image: grafana/alloy:v1.4.1
    container_name: alloy
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --stability.level=public-preview /etc/alloy/config.alloy
    ports:
      - "4317:4317"
      - "4318:4318"  
      - "12345:12345"
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - stocksapp-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    depends_on: 
      - loki
      - tempo
      - prometheus 
    networks: 
     - stocksapp-network

networks:
  stocksapp-network:
    driver: bridge