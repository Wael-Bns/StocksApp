version: '3.8'

services:
  stocksapp.webapi:
    image: stocksappwebapi:dev
    build:
      context: .
      dockerfile: StocksApp.WebApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-container;Port=5432;Database=stocksappdb;Username=postgres;Password=password;
      - RabbitMQ__HostName=rabbitmq-container
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=admin
      - PriceFeedClient__SubscriberId=webapi
      - Observability__ServiceName=StocksApp.WebApi
      - Observability__OtlpEndpoint=
    ports:
      - "8088:8080"
      - "8089:8081"
    depends_on:
      rabbitmq-container:
        condition: service_healthy
      postgres-container:
        condition: service_healthy
    networks:
      - stocksapp-network

  ordersworker:
    image: ordersworker:dev
    build:
      context: .
      dockerfile: StocksApp.OrdersWorker/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-container;Port=5432;Database=stocksappdb;Username=postgres;Password=password;
      - RabbitMQ__HostName=rabbitmq-container
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=admin
      - PriceFeedClient__SubscriberId=ordersworker
      - Observability__ServiceName=StocksApp.OrdersWorker
      - Observability__OtlpEndpoint=
    depends_on:
      rabbitmq-container:
        condition: service_healthy
      postgres-container:
        condition: service_healthy
    networks:
      - stocksapp-network
  
  pricefeed:
    image: stocks-pricefeed:dev
    build:
      context: .
      dockerfile: StocksApp.PriceFeed/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-container;Port=5432;Database=stocksappdb;Username=postgres;Password=password;
      - RabbitMQ__HostName=rabbitmq-container
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=admin
      - PriceFeedClient__SubscriberId=pricefeed
      - Observability__ServiceName=StocksApp.OrdersWorker
      - Observability__OtlpEndpoint=
    depends_on:
      rabbitmq-container:
        condition: service_healthy
    networks:
      - stocksapp-network
   

  outboxdispatcher:
    image: outboxdispatcher:dev
    build:
      context: .
      dockerfile: StocksApp.OutboxDispatcher/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-container;Port=5432;Database=stocksappdb;Username=postgres;Password=password;
      - OutboxOptions__ConnectionString=Host=postgres-container;Port=5432;Database=stocksappdb;Username=postgres;Password=password;
      - RabbitMQ__HostName=rabbitmq-container
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=admin
      - RabbitMQ__Password=admin
      - Observability__ServiceName=StocksApp.OutboxDispatcher
      - Observability__OtlpEndpoint=
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341
    depends_on:
      rabbitmq-container:
        condition: service_healthy
      postgres-container:
        condition: service_healthy
    networks:
      - stocksapp-network

  seq:
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341"
      - "9090:80"
    networks:
      - stocksapp-network

  postgres-container:
    image: postgres:15.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stocksappdb
    ports:
      - "5434:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksappdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stocksapp-network

  rabbitmq-container:
    image: rabbitmq:3.11-management
    ports:
      - "5672:5672"   
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - stocksapp-network

networks:
  stocksapp-network:
    driver: bridge